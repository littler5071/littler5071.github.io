[package]
name = "sysprobe"
version = "0.2.0"
edition = "2021"
description = "跨平台系統探針 ＋ Rust HID 通訊範例（Windows / macOS）"
license = "MIT"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
