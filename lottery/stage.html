<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCKY DRAW｜舞台畫面</title>
<link rel="stylesheet" href="css/stage.css">
</head>
<body class="stage" data-phase="idle">

<div class="bg"></div>
<canvas id="fx"></canvas>
<div class="beam"></div>
<div class="core"></div>
<div class="rays"></div>
<div class="grid-lines"></div>
<div class="vignette"></div>

<header class="stage-head">
  <div class="event-name" id="eventName">LUCKY DRAW</div>
  <div class="head-right">
    <div class="pool-info" id="poolInfo"></div>
    <div class="clock" id="clock">--:--</div>
  </div>
</header>

<div class="stage-body">
  <div class="eyebrow" id="eyebrow">READY</div>

  <div class="slot" id="slot">
    <div class="name" id="name">LUCKY DRAW</div>
    <div class="dept" id="dept"></div>
  </div>

  <div class="winners" id="winners"></div>
</div>

<footer class="stage-foot">
  <div class="prize-tag" id="prizeTag"></div>
  <div class="hint" id="hint">等待控制台操作</div>
  <div class="brand-tag">Merry Christmas</div>
</footer>

<div class="flash" id="flash"></div>

<div class="unlock" id="unlock">
  <div class="unlock-box">
    <div class="unlock-icon">❄</div>
    <div class="unlock-title">點擊啟動聖誕舞台</div>
    <div class="unlock-sub">啟用音效並進入全螢幕</div>
  </div>
</div>

<script src="js/bus.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/stage.js"></script>
</body>
</html>
