<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三牌塔羅｜小R頻道</title>
<meta name="description" content="免註冊的三牌塔羅：洗牌、抽牌、依牌義與位置給出解讀。娛樂用途，不做醫療、投資或法律建議。">
<link rel="canonical" href="https://littler5071.github.io/tarot/">
<meta property="og:title" content="三牌塔羅｜小R頻道">
<meta property="og:description" content="洗牌、抽牌，用三張牌把問題講清楚。">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#0b1020; --bg2:#121a33; --ink:#f2ead6; --sub:#a9b2c9;
    --gold:#c9a227; --gold2:#e8cd79; --line:rgba(201,162,39,.35); --card:#121a2e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2447 0%, transparent 60%),
      linear-gradient(180deg,#0b1020 0%,#0a0e1a 100%);
    color:var(--ink);min-height:100vh;
    font-family:"Noto Serif TC","Songti TC","PingFang TC",serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px clamp(16px,5vw,40px) 80px}
  header{text-align:center;margin-bottom:18px}
  .brand{font-size:13px;letter-spacing:.35em;color:var(--gold);opacity:.85}
  h1{font-size:clamp(24px,5.2vw,34px);margin:8px 0 6px;letter-spacing:.06em}
  .lead{color:var(--sub);font-size:14px;line-height:1.7;margin:0}
  .panel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;margin:18px 0}
  label{display:block;font-size:13px;color:var(--gold2);margin-bottom:6px;letter-spacing:.08em}
  input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:#0e1526;color:var(--ink);font-size:15px;font-family:inherit}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--sub);font-size:13px;cursor:pointer;font-family:inherit}
  .chip.on{background:rgba(201,162,39,.16);color:var(--gold2);border-color:var(--gold)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{font-family:inherit;cursor:pointer;border:0}
  .btn{padding:12px 20px;border-radius:999px;font-size:15px;letter-spacing:.06em;
    background:linear-gradient(180deg,#d9b64a,#b78e1c);color:#1a1406;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold2);font-weight:400}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .deck{display:flex;justify-content:center;gap:14px;margin:22px 0 4px;flex-wrap:nowrap}
  .slot{width:30%;max-width:150px;aspect-ratio:5/8;perspective:900px}
  .cardface{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.7,.2,1);border-radius:12px}
  .slot.flipped .cardface{transform:rotateY(180deg)}
  .side{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .back{background:
      repeating-linear-gradient(45deg,#101a33 0 6px,#0d1526 6px 12px);
    box-shadow:inset 0 0 0 6px rgba(201,162,39,.12)}
  .back svg{width:64%;height:64%;opacity:.85}
  .front{transform:rotateY(180deg);background:linear-gradient(180deg,#f7f1df,#e8dec4);color:#1a1608;
    flex-direction:column;padding:8px;text-align:center;gap:4px}
  .front .nm{font-size:clamp(11px,2.6vw,15px);font-weight:700;letter-spacing:.04em;line-height:1.25}
  .front .num{font-size:clamp(9px,2.2vw,12px);opacity:.7}
  .front .rev{font-size:10px;color:#8a2b2b;font-weight:700}
  .pos{ text-align:center;font-size:12px;color:var(--sub);margin-top:8px;letter-spacing:.12em}
  .reading{margin-top:6px}
  .rline{border-left:2px solid var(--gold);padding:10px 0 10px 14px;margin:14px 0}
  .rline h3{margin:0 0 4px;font-size:15px;color:var(--gold2);letter-spacing:.06em}
  .rline p{margin:0;font-size:14.5px;line-height:1.85;color:#e6dfcd}
  .summary{margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(201,162,39,.08);
    border:1px dashed var(--line);font-size:14.5px;line-height:1.9}
  .hint{color:var(--sub);font-size:12.5px;text-align:center;margin-top:10px}
  .hist{margin-top:22px}
  .hist h2{font-size:15px;color:var(--gold2);letter-spacing:.1em;margin:0 0 8px}
  .hist li{font-size:13px;color:var(--sub);line-height:1.8;border-bottom:1px dotted rgba(255,255,255,.08);
    padding:7px 0;list-style:none}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
    color:#778;font-size:12px;line-height:1.8}
  .disclaimer{color:#8f7a3f}
  @keyframes deal{from{transform:translateY(18px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
  .slot.deal{animation:deal .45s both}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">小R頻道</div>
    <h1>三牌塔羅</h1>
    <p class="lead">先想一個問題，再抽三張牌：過去、現在、未來。<br>牌不預言，它只把你已經知道的事講清楚。</p>
  </header>

  <div class="panel">
    <label for="q">你的問題（可以不填）</label>
    <input id="q" type="text" maxlength="60" placeholder="例如：這段關係我該繼續嗎？">
    <div class="chips" id="topic">
      <button class="chip on" data-t="感情">感情</button>
      <button class="chip" data-t="工作">工作</button>
      <button class="chip" data-t="金錢">金錢</button>
      <button class="chip" data-t="選擇">選擇</button>
      <button class="chip" data-t="自己">自己</button>
    </div>
    <div class="actions">
      <button class="btn" id="shuffle">洗牌</button>
      <button class="btn ghost" id="draw" disabled>抽三張</button>
      <button class="btn ghost" id="reset">重新開始</button>
    </div>
  </div>

  <div class="deck" id="deck">
    <div class="slot" data-i="0"><div class="cardface">
      <div class="side back"><svg viewBox="0 0 100 140" fill="none" stroke="#c9a227" stroke-width="1.1"><rect x="8" y="8" width="84" height="124" rx="6" opacity=".55"/><circle cx="50" cy="70" r="26" opacity=".7"/><path d="M50 40 L58 62 L80 70 L58 78 L50 100 L42 78 L20 70 L42 62 Z" fill="#c9a227" fill-opacity=".18"/><path d="M50 22 v10 M50 108 v10 M22 70 h10 M68 70 h10" opacity=".6"/></svg></div>
      <div class="side front"><div class="nm">—</div></div>
    </div></div>
    <div class="slot" data-i="1"><div class="cardface">
      <div class="side back"><svg viewBox="0 0 100 140" fill="none" stroke="#c9a227" stroke-width="1.1"><rect x="8" y="8" width="84" height="124" rx="6" opacity=".55"/><circle cx="50" cy="70" r="26" opacity=".7"/><path d="M50 40 L58 62 L80 70 L58 78 L50 100 L42 78 L20 70 L42 62 Z" fill="#c9a227" fill-opacity=".18"/><path d="M50 22 v10 M50 108 v10 M22 70 h10 M68 70 h10" opacity=".6"/></svg></div>
      <div class="side front"><div class="nm">—</div></div>
    </div></div>
    <div class="slot" data-i="2"><div class="cardface">
      <div class="side back"><svg viewBox="0 0 100 140" fill="none" stroke="#c9a227" stroke-width="1.1"><rect x="8" y="8" width="84" height="124" rx="6" opacity=".55"/><circle cx="50" cy="70" r="26" opacity=".7"/><path d="M50 40 L58 62 L80 70 L58 78 L50 100 L42 78 L20 70 L42 62 Z" fill="#c9a227" fill-opacity=".18"/><path d="M50 22 v10 M50 108 v10 M22 70 h10 M68 70 h10" opacity=".6"/></svg></div>
      <div class="side front"><div class="nm">—</div></div>
    </div></div>
  </div>
  <div class="pos" id="posline">洗牌後，依序點三張牌</div>

  <div class="reading" id="reading"></div>

  <div class="hist">
    <h2>最近的抽牌</h2>
    <ul id="hist"><li>還沒有紀錄</li></ul>
  </div>

  <footer>
    <p class="disclaimer">娛樂用途。塔羅不提供醫療、投資、法律建議；重大決定請找專業人士。</p>
    <p>牌義整理：小R頻道｜共 78 張（大阿爾克那 22＋四花色 56）</p>
  </footer>
</div>

<script>

const POS = ["過去", "現在", "未來"];
const TOPIC_HINT = {
  "感情": "在關係裡，牌義偏向「你怎麼感受、怎麼表達」。",
  "工作": "在工作上，重點是「資源、節奏與界線」。",
  "金錢": "金錢問題先看「現實條件」，再看你的恐懼。",
  "選擇": "選擇題沒有標準答案，只有你願意承擔哪一種後果。",
  "自己": "回到自己身上：你真正想要的是什麼。"
};
let deck = [], picked = [], topic = "感情", shuffled = false;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function shuffleDeck(){
  deck = CARDS.slice();
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  deck = deck.slice(0,12);
}

function renderBacks(){
  $$(".slot").forEach(s=>{s.classList.remove("flipped","deal");});
  $("#reading").innerHTML="";
}

$("#shuffle").onclick = () => {
  shuffleDeck(); picked=[]; shuffled=true; renderBacks();
  $("#draw").disabled = false;
  $("#posline").textContent = "牌洗好了，點三張牌";
  $$(".slot").forEach((s,i)=>{ s.classList.add("deal"); s.style.animationDelay=(i*70)+"ms"; });
};

$("#reset").onclick = () => {
  picked=[]; shuffled=false; renderBacks();
  $("#draw").disabled = true;
  $("#posline").textContent = "洗牌後，依序點三張牌";
  $("#q").value="";
};

$$("#topic .chip").forEach(c=>c.onclick=()=>{
  $$("#topic .chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on"); topic=c.dataset.t;
});

$$(".slot").forEach(slot=>{
  slot.onclick = () => {
    if(!shuffled || picked.length>=3 || slot.classList.contains("flipped")) return;
    const i = +slot.dataset.i;
    const card = deck[i];
    const rev = Math.random() < 0.4;
    picked.push({...card, isRev: rev, pos: POS[picked.length]});
    const front = slot.querySelector(".front");
    front.innerHTML = `<div class="nm">${card.n}</div>
      <div class="num">${card.arc} ${card.num}</div>
      ${rev?'<div class="rev">逆位</div>':''}`;
    slot.classList.add("flipped");
    if(picked.length===3) renderReading();
  };
});

$("#draw").onclick = () => {
  if(!shuffled) return;
  picked=[];
  $$(".slot").forEach((slot,i)=>{
    const card = deck[i];
    const rev = Math.random() < 0.4;
    picked.push({...card, isRev: rev, pos: POS[i]});
    const front = slot.querySelector(".front");
    front.innerHTML = `<div class="nm">${card.n}</div>
      <div class="num">${card.arc} ${card.num}</div>
      ${rev?'<div class="rev">逆位</div>':''}`;
    setTimeout(()=>slot.classList.add("flipped"), i*220);
  });
  setTimeout(renderReading, 900);
};

function renderReading(){
  const q = $("#q").value.trim();
  const lines = picked.map(c=>{
    const meaning = c.isRev ? c.rev : c.up;
    const kw = c.isRev ? c.kwr : c.kw;
    return `<div class="rline"><h3>${c.pos}｜${c.n}${c.isRev?'（逆位）':''}</h3>
      <p><b>${kw}</b><br>${meaning}</p></div>`;
  }).join("");
  const first = picked[0], now = picked[1], next = picked[2];
  const tone = now.isRev ? "現在這張是逆位，代表卡住的地方不在外面，在你還沒面對的那件事。" :
                         "現在這張是正位，代表你其實已經在對的路上，只是還沒看到成果。";
  const move = next.isRev ? "未來是逆位：先別急著定案，把準備工作做完再動。" :
                          "未來是正位：可以做決定，而且越早動越好。";
  const summary = `<div class="summary">
      <b>${q ? "你的問題：" + q : "這次的焦點：" + topic}</b><br>
      ${TOPIC_HINT[topic]}<br>${tone}<br>${move}
    </div>`;
  $("#reading").innerHTML = `<h2 style="font-size:15px;letter-spacing:.12em;color:var(--gold2);margin:18px 0 4px">解讀</h2>`
    + lines + summary;
  $("#posline").textContent = "解讀完成";
  saveHistory(q);
  $("#reading").scrollIntoView({behavior:"smooth", block:"start"});
}

function saveHistory(q){
  try{
    const key="tarot_hist_v1";
    const arr = JSON.parse(localStorage.getItem(key) || "[]");
    arr.unshift({t: Date.now(), q: q || topic,
      c: picked.map(x=>x.n + (x.isRev?"（逆）":"")).join("、")});
    localStorage.setItem(key, JSON.stringify(arr.slice(0,8)));
    renderHistory();
  }catch(e){}
}

function renderHistory(){
  try{
    const arr = JSON.parse(localStorage.getItem("tarot_hist_v1") || "[]");
    if(!arr.length) return;
    $("#hist").innerHTML = arr.map(x=>{
      const d=new Date(x.t);
      const ds=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      return `<li>${ds}　${x.q}　<span style="color:#c9a227">${x.c}</span></li>`;
    }).join("");
  }catch(e){}
}
renderHistory();
</script>
