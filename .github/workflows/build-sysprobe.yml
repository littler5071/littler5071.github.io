name: build-sysprobe

on:
  push:
    branches: ["rust-demo"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust/sysprobe

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, ext: ".exe" }
          - { os: macos-15-intel, target: x86_64-apple-darwin,    name: macos-x64,   ext: "" }
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Rust 工具鏈
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 快取 cargo 與 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sysprobe -> target
          key: ${{ matrix.target }}

      - name: 編譯 release（sysprobe ＋ hid_probe）
        shell: bash
        env:
          BUILD_OS: ${{ runner.os }}
          BUILD_ARCH: ${{ runner.arch }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          export BUILD_RUSTC="$(rustc --version)"
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo build --release --locked --target "${{ matrix.target }}"
          echo "=== 產出檔案 ==="
          ls -l "target/${{ matrix.target }}/release/sysprobe${{ matrix.ext }}" \
                "target/${{ matrix.target }}/release/hid_probe${{ matrix.ext }}"
          file "target/${{ matrix.target }}/release/sysprobe${{ matrix.ext }}" \
               "target/${{ matrix.target }}/release/hid_probe${{ matrix.ext }}" || true

      - name: 煙霧測試（真的執行，證明 HID 可用）
        shell: bash
        run: |
          set +e
          OUT="$("target/${{ matrix.target }}/release/hid_probe${{ matrix.ext }}" list 2>&1 | head -8)"
          RC=$?
          echo "hid_probe list → exit=$RC"
          echo "$OUT"
          {
            echo "### ${{ matrix.name }} 煙霧測試"
            echo ""
            echo '```'
            echo "sysprobe:"
            "target/${{ matrix.target }}/release/sysprobe${{ matrix.ext }}" | head -6
            echo ""
            echo "hid_probe list:"
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包 macOS app bundle
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release"
          APPDIR="dist/SysProbe.app/Contents"
          mkdir -p "$APPDIR/MacOS" "$APPDIR/Resources"
          cp "$BIN/sysprobe" "$APPDIR/MacOS/sysprobe"
          chmod +x "$APPDIR/MacOS/sysprobe"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>SysProbe</string>' \
            '<key>CFBundleIdentifier</key><string>com.littler5071.sysprobe</string>' \
            '<key>CFBundleVersion</key><string>0.2.0</string>' \
            '<key>CFBundleShortVersionString</key><string>0.2.0</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>CFBundleExecutable</key><string>sysprobe</string>' \
            '<key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '</dict></plist>' > "$APPDIR/Info.plist"
          codesign --force --deep --sign - "dist/SysProbe.app" || true
          cp "$BIN/hid_probe" dist/hid_probe
          cd dist && zip -qry "sysprobe-${{ matrix.name }}.app.zip" SysProbe.app && zip -q "sysprobe-${{ matrix.name }}.app.zip" hid_probe

      - name: 打包 Windows
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release"
          mkdir -p dist
          7z a -tzip "dist/sysprobe-${{ matrix.name }}.zip" "$BIN/sysprobe.exe" "$BIN/hid_probe.exe" >/dev/null

      - name: 產生校驗碼
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            find . -maxdepth 1 -type f -exec sha256sum {} \; > SHA256SUMS.txt
          else
            find . -maxdepth 1 -type f -exec shasum -a 256 {} \; > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
          { echo ""; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sysprobe-${{ matrix.name }}
          path: rust/sysprobe/dist/*
          if-no-files-found: error
          retention-days: 14
